<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Latest Viral Videos For Free</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, #2a1018, transparent 35%),
        radial-gradient(circle at bottom right, #08251a, transparent 35%),
        #070707;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 540px;
      padding: 10px;
      border-radius: 28px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.02)
      );
      box-shadow: 0 25px 70px rgba(0,0,0,0.7);
    }

    .card {
      padding: 28px;
      text-align: center;
      border-radius: 20px;
      background: rgba(25,25,28,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      margin-bottom: 14px;
      border-radius: 50px;
      background: rgba(255,23,68,0.12);
      border: 1px solid rgba(255,23,68,0.25);
      color: #ff6b87;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff1744;
      box-shadow: 0 0 10px #ff1744;
    }

    .title {
      color: #fff;
      font-size: clamp(26px, 6vw, 34px);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* Clickable image */

    .thumbnail-link {
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: 17px;
      margin-bottom: 22px;
      text-decoration: none;
      background: #000;
      box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .thumbnail-link:hover .thumbnail {
      transform: scale(1.05);
    }

    .image-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,0.45)
      );
    }

    .play-button {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 4px;
      border-radius: 50%;
      background: rgba(255,23,68,0.95);
      color: #fff;
      font-size: 27px;
      box-shadow:
        0 0 0 10px rgba(255,23,68,0.15),
        0 12px 35px rgba(255,23,68,0.5);
      transition: 0.3s ease;
    }

    .thumbnail-link:hover .play-button {
      transform: scale(1.1);
    }

    .duration {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 6px 9px;
      border-radius: 7px;
      color: #fff;
      background: rgba(0,0,0,0.75);
      font-size: 12px;
      font-weight: bold;
    }

    /* Buttons */

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 14px 12px;
      border-radius: 13px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .watch {
      color: #fff;
      background: linear-gradient(135deg, #ff1744, #d50036);
      box-shadow: 0 10px 25px rgba(255,23,68,0.25);
    }

    .download {
      color: #fff;
      background: linear-gradient(135deg, #00e676, #00a844);
      box-shadow: 0 10px 25px rgba(0,230,118,0.2);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .watch:hover {
      box-shadow: 0 15px 35px rgba(255,23,68,0.4);
    }

    .download:hover {
      box-shadow: 0 15px 35px rgba(0,230,118,0.35);
    }

    .footer {
      margin-top: 17px;
      color: #6b7280;
      font-size: 12px;
    }

    .secure {
      color: #00e676;
    }

    @media (max-width: 500px) {
      .card {
        padding: 20px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .play-button {
        width: 62px;
        height: 62px;
        font-size: 23px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 16px;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="badge">
        <span class="badge-dot"></span>
        Featured Video
      </div>

      <h1 class="title">
        Watch Viral Videos
      </h1>

      <p class="subtitle">
        Watch the latest video for free
      </p>

      <!-- MAIN IMAGE IS ALSO CLICKABLE -->
      <a
        href="https://revistas.ancib.org.wpwebportals.org/?alpha"
        class="thumbnail-link"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          class="thumbnail"
          src="https://i.imgur.com/2onj0ne.gif"
          alt="Video Thumbnail"
        >

        <div class="image-overlay">
          <div class="play-button">
            ▶
          </div>
        </div>

        <div class="duration">
          WATCH
        </div>

      </a>

      <!-- BUTTONS -->

      <div class="buttons">

        <a
          href="https://revistas.ancib.org.wpwebportals.org/?alpha"
          class="btn watch"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>▶</span>
          Watch Full Video
        </a>

        <a
          href="https://revistas.ancib.org.wpwebportals.org/?alpha"
          class="btn download"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>↓</span>
          Download Now
        </a>

      </div>

      <div class="footer">
        <span class="secure">✓</span>
        Fast &amp; Secure Video Access
      </div>

    </div>

  </div>

</body>
</html>

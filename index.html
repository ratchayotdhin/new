<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Latest Viral Videos For Free</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at top left,
          #2a1018,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #08251a,
          transparent 35%
        ),
        #070707;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* MAIN CONTAINER */

    .container {
      width: 100%;
      max-width: 540px;

      padding: 10px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.02)
        );

      box-shadow:
        0 25px 70px rgba(0,0,0,0.7);
    }

    /* CARD */

    .card {
      padding: 28px;

      text-align: center;

      border-radius: 20px;

      background: rgba(25,25,28,0.92);

      border:
        1px solid rgba(255,255,255,0.08);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* BADGE */

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 7px 13px;

      margin-bottom: 14px;

      border-radius: 50px;

      background:
        rgba(255,23,68,0.12);

      border:
        1px solid rgba(255,23,68,0.25);

      color: #ff6b87;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #ff1744;

      box-shadow:
        0 0 10px #ff1744;
    }

    /* TITLE */

    .title {
      color: #fff;

      font-size:
        clamp(26px, 6vw, 34px);

      line-height: 1.15;

      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;

      font-size: 14px;

      margin-bottom: 22px;
    }

    /* MAIN CLICKABLE IMAGE */

    .thumbnail-link {
      display: block;

      position: relative;

      overflow: hidden;

      border-radius: 17px;

      margin-bottom: 22px;

      text-decoration: none;

      background: #000;

      box-shadow:
        0 18px 40px rgba(0,0,0,0.5);
    }

    .thumbnail {
      width: 100%;

      aspect-ratio: 16 / 9;

      display: block;

      object-fit: cover;

      transition:
        transform 0.5s ease;
    }

    .thumbnail-link:hover .thumbnail {
      transform: scale(1.05);
    }

    /* IMAGE OVERLAY */

    .image-overlay {
      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,0,0,0.45)
        );
    }

    /* PLAY BUTTON */

    .play-button {
      width: 72px;
      height: 72px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding-left: 4px;

      border-radius: 50%;

      background:
        rgba(255,23,68,0.95);

      color: #fff;

      font-size: 27px;

      box-shadow:
        0 0 0 10px rgba(255,23,68,0.15),
        0 12px 35px rgba(255,23,68,0.5);

      transition:
        0.3s ease;
    }

    .thumbnail-link:hover .play-button {
      transform: scale(1.1);
    }

    /* IMAGE LABEL */

    .duration {
      position: absolute;

      right: 12px;

      bottom: 12px;

      padding: 6px 9px;

      border-radius: 7px;

      color: #fff;

      background:
        rgba(0,0,0,0.75);

      font-size: 12px;

      font-weight: bold;
    }

    /* MAIN BUTTONS */

    .buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .btn {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      min-height: 52px;

      padding: 14px 12px;

      border-radius: 13px;

      text-decoration: none;

      font-size: 15px;

      font-weight: bold;

      transition:
        all 0.3s ease;
    }

    .watch {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #ff1744,
          #d50036
        );

      box-shadow:
        0 10px 25px
        rgba(255,23,68,0.25);
    }

    .download {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #00e676,
          #00a844
        );

      box-shadow:
        0 10px 25px
        rgba(0,230,118,0.2);
    }

    .btn:hover {
      transform:
        translateY(-3px);
    }

    .watch:hover {
      box-shadow:
        0 15px 35px
        rgba(255,23,68,0.4);
    }

    .download:hover {
      box-shadow:
        0 15px 35px
        rgba(0,230,118,0.35);
    }

    /* SERIAL VIDEO SECTION */

    .video-list {
      margin-top: 28px;

      text-align: left;
    }

    .list-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 13px;
    }

    .list-title {
      color: #fff;

      font-size: 19px;

      font-weight: bold;
    }

    .list-count {
      color: #888;

      font-size: 12px;
    }

    /* EACH VIDEO */

    .video-item {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 10px;

      padding: 12px;

      border:
        1px solid rgba(255,255,255,0.07);

      border-radius: 13px;

      background:
        rgba(255,255,255,0.035);

      transition:
        all 0.25s ease;
    }

    .video-item:hover {
      background:
        rgba(255,255,255,0.075);

      transform:
        translateX(3px);

      border-color:
        rgba(255,23,68,0.2);
    }

    /* SERIAL NUMBER */

    .number {
      width: 36px;
      height: 36px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 9px;

      background:
        rgba(255,23,68,0.12);

      color: #ff5b78;

      font-size: 13px;

      font-weight: bold;
    }

    /* VIDEO TITLE */

    .video-name {
      flex: 1;

      color: #eee;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.3;
    }

    /* SMALL WATCH BUTTON */

    .item-btn {
      padding: 10px 13px;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #ff1744,
          #d50036
        );

      color: #fff;

      text-decoration: none;

      font-size: 12px;

      font-weight: bold;

      white-space: nowrap;

      transition:
        0.25s ease;
    }

    .item-btn:hover {
      transform:
        scale(1.05);

      box-shadow:
        0 5px 15px
        rgba(255,23,68,0.3);
    }

    /* FOOTER */

    .footer {
      margin-top: 18px;

      color: #6b7280;

      font-size: 12px;
    }

    .secure {
      color: #00e676;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .card {
        padding: 20px;
      }

      .buttons {
        grid-template-columns:
          1fr;
      }

      .play-button {
        width: 62px;
        height: 62px;

        font-size: 23px;
      }

      .video-item {
        padding: 10px;
      }

      .video-name {
        font-size: 13px;
      }

      .item-btn {
        padding: 9px 10px;

        font-size: 11px;
      }
    }

    @media (max-width: 360px) {

      .card {
        padding: 16px;
      }

      .title {
        font-size: 24px;
      }

      .number {
        width: 32px;
        height: 32px;
      }

      .video-name {
        font-size: 12px;
      }

      .item-btn {
        padding: 8px;
      }
    }

  </style>
</head>
